# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build and test .NET server

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - "*"

jobs:
  build:
    runs-on: [self-hosted, linux, x64]

    defaults:
      run:
        working-directory: ./server

    steps:
      - uses: actions/checkout@v4
      - name: Install gettext (msgfmt)
        run: |
          if ! command -v msgfmt &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq gettext
          fi
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
        env:
          DOTNET_CLI_DO_NOT_PROMPT_FOR_WORKLOAD_UPDATE: true
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build --verbosity normal
      - name: Check missing localizations
        run: bash check-missing-localizations.sh
